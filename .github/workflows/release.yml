name: Release

# Push a tag like v0.1.0 (matching the version in pyproject.toml, server.json
# and manifest.json) to publish to PyPI and the MCP Registry, and attach the
# Claude Desktop extension (.mcpb) to a GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - run: uv sync --extra agent
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/mcpb pack . dist-mcpb/label-image-mcp.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            dist-mcpb/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login for the io.github.sachinbkale27 namespace
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          # The registry verifies the package on PyPI, which can take a minute to appear
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - run: gh release create "$GITHUB_REF_NAME" dist-mcpb/label-image-mcp.mcpb dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
