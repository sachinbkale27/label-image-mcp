[project]
name = "label-image-mcp"
version = "0.6.1"
description = "Image Annotation, including Histopathology slides; From H&E slide to training data in one conversation: nuclei, outlines and slide QC, exported to QuPath, COCO or YOLO. No GPU needed. Try it: https://agent.sachin-kale.com/#annotate"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sachin Kale" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "image-annotation", "coco", "yolo", "langgraph", "histopathology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    # langchain-mcp-adapters does not support mcp 2.x yet
    "mcp>=1.24,<2",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
agent = [
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-mcp-adapters>=0.3",
    "langchain-anthropic>=1.0",
]

[project.urls]
Homepage = "https://agent.sachin-kale.com/#annotate"
Documentation = "https://labels.sachin-kale.com/mcp"
Source = "https://github.com/sachinbkale27/label-image-mcp"
Issues = "https://github.com/sachinbkale27/label-image-mcp/issues"

[project.scripts]
label-image-mcp = "label_image_mcp.server:main"
label-image-agent = "label_image_mcp.agent:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/label_image_mcp"]

[tool.hatch.build.targets.sdist]
# The README shows the demo from GitHub; the package doesn't need its own copy
exclude = ["docs/*.gif"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
